name: Deploy Mothscilla to Scaleway

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    # Only run if commit message contains '/prod'
    if: contains(github.event.head_commit.message, '/prod') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        # Also builds the vendored @synflow/core submodule (postinstall).
        run: npm ci

      - name: Build Mothscilla
        run: npm run build
        env:
          NODE_ENV: production

      - name: Deploy to Scaleway Object Storage
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.SCW_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SCW_SECRET_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.SCW_REGION }}
          BUCKET_NAME: ${{ secrets.MOTHSCILLA_BUCKET_NAME }}
          SCW_REGION: ${{ secrets.SCW_REGION }}
        run: |
          export AWS_ENDPOINT_URL=https://s3.$SCW_REGION.scw.cloud

          # Hashed assets (immutable). Leave any /synflow/ prefix alone — that
          # was a same-origin copy of the editor from the old co-deploy setup;
          # the editor now lives at its own origin (synflow.org), embedded
          # cross-origin via SynflowEditor.tsx, so nothing here should touch it.
          aws s3 sync dist/ s3://$BUCKET_NAME/ \
            --endpoint-url=$AWS_ENDPOINT_URL \
            --delete \
            --cache-control "public, max-age=31536000, immutable" \
            --exclude "index.html" \
            --exclude "*.html" \
            --exclude "synflow/*"

          # HTML with no-cache for SPA routing
          aws s3 sync dist/ s3://$BUCKET_NAME/ \
            --endpoint-url=$AWS_ENDPOINT_URL \
            --exclude "*" \
            --include "*.html" \
            --cache-control "public, max-age=0, must-revalidate"

          echo "✅ Mothscilla deployment completed successfully!"

      - name: Deployment summary
        run: |
          echo "## 🦋 Mothscilla Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Domain**: https://mothscilla.org" >> $GITHUB_STEP_SUMMARY
          echo "- **Bucket**: ${{ secrets.MOTHSCILLA_BUCKET_NAME }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit**: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Author**: ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
